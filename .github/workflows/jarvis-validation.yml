name: JARVIS validation

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate V4 release metadata coherence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          integration = root / 'custom_components' / 'jarvis'
          frontend = integration / 'frontend'
          manifest = json.loads((integration / 'manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']

          assert manifest['name'] == 'JARVIS Core V4'
          assert f'ASSET_VERSION = "{version}"' in (integration / '__init__.py').read_text(encoding='utf-8')
          assert f"JARVIS_RUNTIME_VERSION='{version}'" in (frontend / 'jarvis-runtime.js').read_text(encoding='utf-8')
          assert f'v={version}-native' in (frontend / 'jarvis-runtime-v4.js').read_text(encoding='utf-8')
          assert f"JARVIS_CORE_VERSION='{version}'" in (frontend / 'jarvis-core-v4.js').read_text(encoding='utf-8')
          assert f"VERSION='{version}'" in (frontend / 'jarvis-panel-v4.js').read_text(encoding='utf-8')
          assert f'JARVIS V{version}' in (frontend / 'jarvis-preview-v4.js').read_text(encoding='utf-8')
          assert f'JARVIS V{version}' in (frontend / 'jarvis-v4-final.js').read_text(encoding='utf-8')
          assert not (frontend / 'jarvis-v4-native-fix.js').exists()

          user_facing = [
              integration / 'strings.json',
              integration / 'translations' / 'fr.json',
              integration / 'translations' / 'en.json',
              root / 'README.md',
              root / 'info.md',
              root / 'hacs.json',
          ]
          for path in user_facing:
              text = path.read_text(encoding='utf-8')
              assert 'Core V3' not in text, f'stale V3 label in {path}'

          hacs = json.loads((root / 'hacs.json').read_text(encoding='utf-8'))
          assert hacs['name'] == 'JARVIS Core V4'
          print(f'JARVIS release metadata coherent: {version}')
          PY

      - name: Install exact Home Assistant 2026.8.2 validation environment
        run: |
          python -m pip install --upgrade pip
          mkdir -p homeassistant
          curl -fsSL https://raw.githubusercontent.com/home-assistant/core/2026.8.2/homeassistant/package_constraints.txt -o homeassistant/package_constraints.txt
          curl -fsSL https://raw.githubusercontent.com/home-assistant/core/2026.8.2/requirements.txt -o requirements.txt
          python -m pip install -c homeassistant/package_constraints.txt -r requirements.txt "homeassistant==2026.8.2"

      - name: Compile integration
        run: python -m compileall -q custom_components/jarvis

      - name: Import integration and config flow
        run: |
          python - <<'PY'
          import importlib
          integration = importlib.import_module("custom_components.jarvis")
          flow = importlib.import_module("custom_components.jarvis.config_flow")
          from homeassistant.config_entries import ConfigFlow

          assert hasattr(integration, "async_setup")
          assert issubclass(flow.ConfigFlow, ConfigFlow)
          assert flow.ConfigFlow.VERSION == 1
          assert hasattr(flow.ConfigFlow, "async_step_user")
          assert hasattr(flow.ConfigFlow, "async_get_options_flow")
          print("JARVIS integration import: OK")
          print("JARVIS config flow import: OK")
          print("JARVIS options flow: OK")
          PY

      - name: Validate frontend JavaScript syntax
        run: |
          for file in custom_components/jarvis/frontend/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
