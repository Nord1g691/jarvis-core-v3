<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Energy URL Test</title><style>body{margin:0;background:#020711;color:#dffaff;font:16px Arial;padding:24px}.card{max-width:600px;margin:auto;border:1px solid #00eaff55;border-radius:12px;padding:20px;background:#031322}h1{font-size:20px}.v{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #00eaff22}.n{font-weight:bold}.ok{color:#39ff88}.err{color:#ff6b6b}small{color:#79bfd8}</style></head><body><div class="card"><h1>JARVIS — Test URL énergie</h1><small>Cette page teste uniquement l'accès aux états HA. Aucun élément du HUD n'est modifié.</small><div id="out">Connexion…</div></div><script>(()=>{const ids={production:'sensor.envoy_122323101280_production_solaire_instantanee',consumption:'sensor.envoy_122323101280_consommation_electrique_actuelle',import:'sensor.puissance_import_reseau',export:'sensor.puissance_export_reseau'};const out=document.getElementById('out');const kw=s=>{if(!s)return null;const n=Number(s.state);if(!Number.isFinite(n))return null;const u=String(s.attributes?.unit_of_measurement||'W').toLowerCase();return u.includes('kw')?n:n/1000};const show=states=>{out.innerHTML=Object.entries(ids).map(([k,id])=>{const v=kw(states[id]);return `<div class="v"><span>${k.toUpperCase()}</span><span class="n ${v==null?'err':'ok'}">${v==null?'indisponible':v.toFixed(1)+' kW'}</span></div>`}).join('')};const boot=()=>{try{const ls=localStorage;const raw=ls.getItem('hassTokens');if(!raw){out.innerHTML='<p class="err">Session HA non accessible depuis cette page.</p>';return}const data=JSON.parse(raw);const token=data?.access_token||data?.[Object.keys(data)[0]]?.access_token;if(!token){out.innerHTML='<p class="err">Token de session introuvable.</p>';return}fetch('/api/states',{headers:{Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(list=>show(Object.fromEntries(list.map(s=>[s.entity_id,s])))).catch(e=>{out.innerHTML='<p class="err">API HA inaccessible : '+e.message+'</p>'})}catch(e){out.innerHTML='<p class="err">Erreur : '+e.message+'</p>'}};boot()})();</script></body></html>
