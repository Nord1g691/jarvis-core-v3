name: JARVIS validation

on:
  push:
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact Home Assistant 2026.2.3 validation environment
        run: |
          python -m pip install --upgrade pip
          mkdir -p homeassistant
          curl -fsSL https://raw.githubusercontent.com/home-assistant/core/2026.2.3/homeassistant/package_constraints.txt -o homeassistant/package_constraints.txt
          curl -fsSL https://raw.githubusercontent.com/home-assistant/core/2026.2.3/requirements.txt -o requirements.txt
          python -m pip install -c homeassistant/package_constraints.txt -r requirements.txt "homeassistant==2026.2.3"

      - name: Compile integration
        run: python -m compileall -q custom_components/jarvis

      - name: Import integration and config flow
        run: |
          python - <<'PY'
          import importlib
          integration = importlib.import_module("custom_components.jarvis")
          flow = importlib.import_module("custom_components.jarvis.config_flow")
          from homeassistant.config_entries import ConfigFlow

          assert hasattr(integration, "async_setup")
          assert issubclass(flow.ConfigFlow, ConfigFlow)
          assert flow.ConfigFlow.VERSION == 1
          assert hasattr(flow.ConfigFlow, "async_step_user")
          assert hasattr(flow.ConfigFlow, "async_get_options_flow")
          print("JARVIS integration import: OK")
          print("JARVIS config flow import: OK")
          print("JARVIS options flow: OK")
          PY

      - name: Validate frontend JavaScript syntax
        run: |
          for file in custom_components/jarvis/frontend/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master
